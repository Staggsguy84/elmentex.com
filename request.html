<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Start a Project | ElmenTex Creations</title>
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <a href="index.html" class="logo">
      <img src="images/logo.jpg" alt="ElmenTex oak tree logo">
      <h1>ElmenTex</h1>
    </a>
    <nav>
      <a href="index.html">Home</a>
      <a href="gallery.html">Gallery</a>
      <a href="request.html">Start a Project</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <section class="hero">
    <h2>Tell Me What You’re Looking For</h2>
    <p>Describe your idea, what material or process you prefer, and how I can reach you. I’ll reply with questions or a quote.</p>
  </section>

  <section>

    <form action="https://formspree.io/f/YOUR_FORM_ID" method="POST">
      <label for="name">Your Name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="phone">Phone (optional)</label>
      <input type="tel" id="phone" name="phone">

      <label for="service">What are you interested in?</label>
      <select id="service" name="service" required>
        <option value="">— Select —</option>
        <option value="3D Print">3D Print</option>
        <option value="Laser Engraving / Cutting">Laser Engraving / Cutting</option>
        <option value="CNC Cut">CNC Cut</option>
        <option value="Not sure / Combination">Not sure / Combination</option>
      </select>

      <label for="description">Describe what you want made</label>
      <textarea id="description" name="description" placeholder="Size, material preference, quantity, deadline, special details, or just your idea..." required></textarea>

      <label for="upload">Upload photos, sketches, or files (optional)</label>
      <input type="file" id="upload" name="upload" accept="image/*,.stl,.pdf,.ai,.svg,.dxf" multiple>

      <!-- Honeypot for spam -->
      <input type="text" name="_gotcha" style="display:none">

      <button type="submit">Send Request</button>
    </form>
  </section>

  <footer>
    <p>ElmenTex Creations · San Antonio / Elmendorf, Texas</p>
    <p><a href="mailto:elmentexcreations@gmail.com">elmentexcreations@gmail.com</a></p>
  </footer>
</body>
</html>
